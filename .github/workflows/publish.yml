name: Publish and deploy appeals

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-and-deploy
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Publish due posts
        id: publish
        run: python publisher.py
      - name: Build crawlable pages and sitemap
        if: ${{ steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Update scheduled appeals')) }}
        run: python build_search.py
      - name: Save publication state
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json schedule.json
            git commit -m "Update scheduled appeals"
            git push
          fi
      - name: Configure Pages
        if: ${{ steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Update scheduled appeals')) }}
        uses: actions/configure-pages@v5
      - name: Upload site
        if: ${{ steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Update scheduled appeals')) }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy site
        if: ${{ steps.publish.outputs.published == 'true' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Update scheduled appeals')) }}
        id: deployment
        uses: actions/deploy-pages@v4
